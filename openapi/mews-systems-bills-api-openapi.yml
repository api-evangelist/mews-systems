components:
  schemas:
    StringUpdateValue:
      title: String update value
      type: object
      properties:
        Value:
          type:
          - string
          - 'null'
          description: Value which is to be updated.
          example: string
      additionalProperties: false
      x-schema-id: StringUpdateValue
    Amount:
      title: Amount
      required:
      - Breakdown
      - Currency
      - GrossValue
      - NetValue
      - TaxValues
      type: object
      properties:
        Currency:
          minLength: 1
          type: string
          description: ISO-4217 code of the [Currency](https://mews-systems.gitbook.io/connector-api/operations/currencies/#currency).
          format: currency
          example: EUR
        NetValue:
          type: number
          description: Net value without taxes.
          format: double
          example: 100.0
        GrossValue:
          type: number
          description: Gross value including all taxes.
          format: double
          example: 100.0
        TaxValues:
          type: array
          items:
            $ref: '#/components/schemas/TaxValue'
          description: The tax values applied.
        Breakdown:
          title: Tax breakdown
          allOf:
          - $ref: '#/components/schemas/TaxBreakdown'
          description: Information about individual tax amounts.
          example: string
      additionalProperties: false
      description: ''
      x-schema-id: Amount
    FinancialDocumentPdfTemplateTypeEnum:
      title: Bill PDF template type
      enum:
      - Detailed
      - Consumption
      - Reservation
      - OrderItem
      - Guest
      type: string
      description: '


        Detailed (Detailed overview. Items are grouped by the reservation, item type and price, and consumption date.)


        Consumption (Overview by date (no reservation details). Items of the same type and price are grouped by consumption date.)


        Reservation (Overview by reservation (no date). Items of the same type and price are grouped by reservation.)


        OrderItem (Consumption overview (not fiscal document). Items are grouped by the item type and price without reservation details and consumption date.)


        Guest (Overview by guest. Items are grouped by guest, reservation, consumption date, and item type.)'
      x-enumNames:
      - Detailed
      - Consumption
      - Reservation
      - OrderItem
      - Guest
      x-enumDescriptions:
      - Detailed overview. Items are grouped by the reservation, item type and price, and consumption date.
      - Overview by date (no reservation details). Items of the same type and price are grouped by consumption date.
      - Overview by reservation (no date). Items of the same type and price are grouped by reservation.
      - Consumption overview (not fiscal document). Items are grouped by the item type and price without reservation details and consumption date.
      - Overview by guest. Items are grouped by guest, reservation, consumption date, and item type.
    BillCustomerData:
      title: Bill customer data
      required:
      - Id
      - LastName
      type: object
      properties:
        Id:
          minLength: 1
          type: string
          description: ID of the `Customer` to whom the bill was assigned.
          example: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
        Address:
          allOf:
          - $ref: '#/components/schemas/Address'
          description: Address of the customer.
          example: string
        LegalIdentifiers:
          type:
          - object
          - 'null'
          additionalProperties:
            type: string
          description: The set of `LegalIdentifiers` for the customer.
        BillingCode:
          type:
          - string
          - 'null'
          description: A unique code for Mews to list on invoices it sends to the customer.
          example: string
        LastName:
          minLength: 1
          type: string
          description: Last name of the customer.
          example: Example Name
        FirstName:
          type:
          - string
          - 'null'
          description: First name of the customer.
          example: Example Name
        SecondLastName:
          type:
          - string
          - 'null'
          description: Second last name of the customer.
          example: Example Name
        TitlePrefix:
          allOf:
          - $ref: '#/components/schemas/Title'
          description: 'Title prefix of the customer.


            Mister (Mr.)


            Miss (Ms.)


            Misses (Mrs.)'
          example: string
        TaxIdentifier:
          type:
          - string
          - 'null'
          description: Tax identifier of the customer.
          example: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
      additionalProperties: false
      x-schema-id: BillCustomerData
    BillAccountData:
