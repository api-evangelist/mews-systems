openapi: 3.2.0
info:
  title: Mews Booking Engine API (Distributor) Account notes Rate groups API
  version: v1
  description: The Mews Booking Engine API (historically the Distributor API, served from /api/distributor/v1) lets developers build guest-facing booking engines that create reservations directly in Mews. It exposes enterprise configuration, availability, pricing, products, vouchers, payment cards, and reservation group creation for front-end client consumption.
  x-generated-from: documentation
  x-source-url: https://api.mews.com/Swagger/distributor/swagger.json
  x-last-validated: '2026-06-02'
servers:
- url: https://api.mews.com
  description: Production
- url: https://api.mews-demo.com
  description: Demo / sandbox
security:
- MewsClientToken: []
  MewsAccessToken: []
tags:
- name: Rate groups
paths:
  /api/connector/v1/rateGroups/getAll:
    post:
      tags:
      - Rate groups
      summary: Mews Get All Rate Groups
      description: Returns all rate groups, filtered by unique identifiers and other filters. Note this operation uses [Pagination](https://mews-systems.gitbook.io/connector-api/guidelines/pagination/) and supports [Portfolio Access Tokens](https://mews-systems.gitbook.io/connector-api/concepts/multi-property).
      operationId: rateGroups_getAll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RateGroupFilterParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
              Client: Sample Client 1.0.0
              RateGroupIds:
              - 6b3f718a-b537-45b0-a8ee-d30897723834
              ServiceIds:
              - bd26d8db-86da-4f96-9efc-e5a4654a4a94
              ExternalIdentifiers:
              - RG-001
              UpdatedUtc:
                StartUtc: '2024-01-27T11:48:57Z'
                EndUtc: '2024-02-27T11:48:57Z'
              ActivityStates:
              - Active
              EnterpriseIds:
              - 3fa85f64-5717-4562-b3fc-2c963f66afa6
              - 4d0201db-36f5-428b-8d11-4f0a65e960cc
              Limitation:
                Count: 1000
                Cursor: e7f26210-10e7-462e-9da8-ae8300be8ab7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateGroupResult'
              example:
                RateGroups:
                - Id: 6b3f718a-b537-45b0-a8ee-d30897723834
                  ServiceId: bd26d8db-86da-4f96-9efc-e5a4654a4a94
                  IsActive: true
                  CreatedUtc: '2023-01-11T13:32:32Z'
                  UpdatedUtc: '2023-01-13T15:27:28Z'
                  Ordering: 0
                  Names:
                    en-US: Default group
                  ShortNames:
                    en-US: Default group
                  Descriptions:
                    en-US: Default group
                  ExternalIdentifier: RG-001
                Cursor: 6b3f718a-b537-45b0-a8ee-d30897723834
        '400':
          description: Error caused by the client app, e.g. in case of malformed request or invalid identifier of a resource. In most cases, such an error signifies a bug in the client app (consumer of the API).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorApiExceptionResult'
              examples:
                RateGroupsGetAll400Example:
                  summary: Default rateGroups_getAll 400 response
                  x-microcks-default: true
                  value:
                    Message: string
                    RequestId: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
                    Details: string
        '401':
          description: Error caused by usage of invalid ClientToken, AccessToken, or you may not have the necessary permission to use the endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorApiExceptionResult'
              examples:
                RateGroupsGetAll401Example:
                  summary: Default rateGroups_getAll 401 response
                  x-microcks-default: true
                  value:
                    Message: string
                    RequestId: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
                    Details: string
        '403':
          description: Server error that should be reported to the end user of the client app. Happens for example when the server-side validation fails or when a business-logic check is violated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorApiExceptionResult'
              examples:
                RateGroupsGetAll403Example:
                  summary: Default rateGroups_getAll 403 response
                  x-microcks-default: true
