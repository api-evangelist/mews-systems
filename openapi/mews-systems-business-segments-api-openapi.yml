- url: https://api.mews.com
  description: Production
- url: https://api.mews-demo.com
  description: Demo / sandbox
security:
- MewsClientToken: []
  MewsAccessToken: []
tags:
- name: Business segments
paths:
  /api/connector/v1/businessSegments/getAll:
    post:
      tags:
      - Business segments
      summary: Mews Get All Business Segments
      description: Returns all business segments. This operation supports [Portfolio Access Tokens](https://mews-systems.gitbook.io/connector-api/concepts/multi-property/).
      operationId: businessSegments_getAll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BusinessSegmentFilterParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
              Client: Sample Client 1.0.0
              Ids:
              - 7760b5cb-a666-41bb-9758-76bf5d1df399
              - 54ec08b6-e6fc-48e9-b8ae-02943e0ac693
              ServiceIds:
              - bd26d8db-86da-4f96-9efc-e5a4654a4a94
              - 8c1bd738-a505-4b29-aa71-9ecc2982b843
              UpdatedUtc:
                StartUtc: '2023-10-01T00:00:00Z'
                EndUtc: '2023-10-31T00:00:00Z'
              ActivityStates:
              - Active
              EnterpriseIds:
              - 3fa85f64-5717-4562-b3fc-2c963f66afa6
              - 4d0201db-36f5-428b-8d11-4f0a65e960cc
              Limitation:
                Count: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BusinessSegmentResult'
              example:
                BusinessSegments:
                - Id: 7760b5cb-a666-41bb-9758-76bf5d1df399
                  ServiceId: bd26d8db-86da-4f96-9efc-e5a4654a4a94
                  IsActive: true
                  Name: Business
                  CreatedUtc: '2023-10-01T00:00:00Z'
                  UpdatedUtc: '2023-10-01T00:00:00Z'
                - Id: 54ec08b6-e6fc-48e9-b8ae-02943e0ac693
                  ServiceId: 8c1bd738-a505-4b29-aa71-9ecc2982b843
                  IsActive: true
                  Name: Leisure
                  CreatedUtc: '2023-10-01T00:00:00Z'
                  UpdatedUtc: '2023-10-01T00:00:00Z'
                Cursor: 54ec08b6-e6fc-48e9-b8ae-02943e0ac693
