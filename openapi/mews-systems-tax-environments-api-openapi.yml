components:
  schemas:
    Parameters:
      title: Parameters
      required:
      - AccessToken
      - Client
      - ClientToken
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
          example: string
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
          example: string
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
          example: string
      additionalProperties: false
      x-schema-id: Parameters
    TaxEnvironment:
      title: Tax environment
      required:
      - Code
      - CountryCode
      - TaxationCodes
      type: object
      properties:
        Code:
          minLength: 1
          type: string
          description: Code of the tax environment.
          example: string
        CountryCode:
          minLength: 1
          type: string
          description: ISO 3166-1 alpha-3 code of associated country, e.g. `USA` or `GBR`.
          example: string
        ValidityStartUtc:
          type:
          - string
          - 'null'
          description: If specified, marks the start of the validity interval in UTC timezone in ISO 8601 format.
          example: string
        ValidityEndUtc:
          type:
          - string
          - 'null'
          description: If specified, marks the end of the validity interval in UTC timezone in ISO 8601 format.
          example: string
        TaxationCodes:
          type: array
          items:
            type: string
          description: Codes of the `Taxation` that are used by this environment.
      additionalProperties: false
      description: Tax environment represents set of `Taxation` together with optional validity interval.
      x-schema-id: TaxEnvironment
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
      type: object
      properties:
        Message:
          type:
          - string
          - 'null'
          example: string
        RequestId:
          type:
