paths:
  /api/connector/v1/taxEnvironments/getAll:
    post:
      tags:
      - Tax environments
      summary: Mews Get All Tax Environments
      description: Returns all tax environments supported by the API.
      operationId: taxEnvironments_getAll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
              Client: Sample Client 1.0.0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxEnvironmentResult'
              example:
                TaxEnvironments:
                - Code: AT-2020
                  CountryCode: AUT
                  ValidityStartUtc: '2020-06-30T22:00:00Z'
                  ValidityEndUtc: null
                  TaxationCodes:
                  - AT-2020
                - Code: AW-2023
                  CountryCode: ABW
                  ValidityStartUtc: '2023-01-01T04:00:00Z'
                  ValidityEndUtc: null
                  TaxationCodes:
                  - AW-2023
                  - AW-TOURIST-2023
                  - AW-RESIDENCE
                - Code: CA-QC-TR-2023
                  CountryCode: CAN
                  ValidityStartUtc: '2023-10-19T19:00:00Z'
                  ValidityEndUtc: null
                  TaxationCodes:
                  - CA-TR-2023
                  - CA-QC-2023
                  - CA-QC-LODGING-2023
                  - CA-QC-LO-FLAT
                - Code: PH-MA-CUSTOM
