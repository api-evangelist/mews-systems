components:
  schemas:
    CountryGroup:
      title: Country group
      required:
      - Code
      - CountryCodes
      - EnglishName
      type: object
      properties:
        Code:
          minLength: 1
          type: string
          description: Group code, e.g. `EU`, `SCHENGEN`, `NORDIC`...
          example: string
        EnglishName:
          minLength: 1
          type: string
          description: English name of the country group.
          example: Example Name
        CountryCodes:
          type: array
          items:
            type: string
          description: Codes of countries included in the group, in ISO 3166-1 alpha-2 format.
      additionalProperties: false
      x-schema-id: CountryGroup
    BookingEngineParameters:
      title: BookingEngineParameters
      required:
      - Client
      - ConfigurationId
      - FullAmounts
      type: object
      properties:
        Client:
          minLength: 1
          type: string
          example: string
        LanguageCode:
          type:
          - string
          - 'null'
          example: string
        CultureCode:
          type:
          - string
          - 'null'
          example: string
        FullAmounts:
          type: boolean
          example: true
        Session:
          type:
          - string
          - 'null'
          example: string
        ConfigurationId:
          type: string
          format: uuid
          example: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
      additionalProperties: false
      x-schema-id: BookingEngineParameters
    CountryResult_2:
      title: CountryResult
      required:
      - Countries
      - CountryGroups
      - CountryRules
      - CountrySubdivisions
      type: object
      properties:
        Countries:
          type: array
          items:
            $ref: '#/components/schemas/Country_2'
          description: The supported countries.
        CountrySubdivisions:
          type: array
          items:
            $ref: '#/components/schemas/CountrySubdivision'
          description: The supported country subdivisions.
        CountryRules:
          type: array
          items:
            $ref: '#/components/schemas/CountryRule'
          description: Country-specific rules
        CountryGroups:
          title: Country group
          type: array
          items:
            $ref: '#/components/schemas/CountryGroup'
          description: The supported country groups.
      additionalProperties: false
      x-schema-id: CountryResult
    Parameters:
      title: Parameters
      required:
      - AccessToken
      - Client
      - ClientToken
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
          example: string
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
          example: string
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
          example: string
      additionalProperties: false
      x-schema-id: Parameters
    CountryResult:
      title: CountryResult
      required:
      - Countries
      type: object
      properties:
        Countries:
          type: array
          items:
            $ref: '#/components/schemas/Country'
      additionalProperties: false
      x-schema-id: CountryResult
    Country_2:
      title: Country
      required:
      - Code
      - EnglishName
      - SovereignCountryCode
      type: object
      properties:
        Code:
          minLength: 1
          type: string
          description: ISO 3166-1 alpha-2 code, e.g. `CZ` or `SK`.
          example: string
        SovereignCountryCode:
          minLength: 1
          type: string
          description: ISO 3166-1 alpha-2 code of the sovereign country. May differ from `Code` for dependent territories.
          example: string
        EnglishName:
          minLength: 1
          type: string
          description: English name of the country.
          example: Example Name
      additionalProperties: false
      x-schema-id: Country
    Country:
      title: Country
      required:
      - Code
      - Name
      type: object
      properties:
        Code:
          maxLength: 2
          minLength: 1
          type: string
          example: string
        SovereignCountryCode:
          type:
          - string
          - 'null'
          example: string
        Name:
          minLength: 1
          type: string
          example: Example Name
      additionalProperties: false
      x-schema-id: Country
    CountrySubdivision:
      title: Country subdivision
      required:
      - Code
      - CountryCode
      - EnglishName
      type: object
      properties:
        Code:
          minLength: 1
          type: string
          description: ISO 3166-2 code of the administrative division, e.g AU-QLD.
          example: string
        CountryCode:
          minLength: 1
          type: string
          description: ISO 3166-1 code of the [Country](https://mews-systems.gitbook.io/connector-api/operations/countries#country).
          example: string
        EnglishName:
          minLength: 1
          type: string
          description: English name of the country subdivision.
          example: Example Name
      additionalProperties: false
      x-schema-id: CountrySubdivision
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
      type: object
      properties:
        Message:
          type:
          - string
          - 'null'
          example: string
        RequestId:
          type:
          - string
          - 'null'
          example: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
        Details:
          example: string
      additionalProperties: false
      x-schema-id: ConnectorApiExceptionResult
    CountryRule:
      title: Country rules
      required:
      - CountryCode
      - DriverLicenceExpirationDateNotRequired
      - IdentityCardExpirationDateNotRequired
      type: object
      properties:
        CountryCode:
          minLength: 1
          type: string
          description: ISO 3166-1 alpha-2 code, e.g. US or GB.
          example: string
        IdentityCardExpirationDateNotRequired:
          type: boolean
          description: Whether the country requires expiration date for identity card.
          example: true
        DriverLicenceExpirationDateNotRequired:
          type: boolean
          description: Whether the country requires expiration date for driver's license.
          example: true
      additionalProperties: false
      description: Country-specific rules
      x-schema-id: CountryRule
  securitySchemes:
    MewsClientToken:
      type: apiKey
      in: header
      name: ClientToken
      description: Mews authentication is performed by supplying ClientToken, AccessToken and Client as fields in the JSON request body (not as HTTP headers). This securityScheme is a tooling-compatible representation of the ClientToken credential. ClientToken is unique to your application and identifies the API client.
    MewsAccessToken:
      type: apiKey
      in: header
      name: AccessToken
      description: Tooling-compatible representation of the AccessToken credential, which is supplied in the JSON request body. AccessToken is unique to the connection with a property (enterprise) and identifies the property or properties whose data and services you can access. Portfolio Access Tokens enable multi-property access with a single token.
