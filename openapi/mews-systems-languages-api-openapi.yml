openapi: 3.2.0
info:
  title: Mews Booking Engine API (Distributor) Account notes Languages API
  version: v1
  description: The Mews Booking Engine API (historically the Distributor API, served from /api/distributor/v1) lets developers build guest-facing booking engines that create reservations directly in Mews. It exposes enterprise configuration, availability, pricing, products, vouchers, payment cards, and reservation group creation for front-end client consumption.
  x-generated-from: documentation
  x-source-url: https://api.mews.com/Swagger/distributor/swagger.json
  x-last-validated: '2026-06-02'
servers:
- url: https://api.mews.com
  description: Production
- url: https://api.mews-demo.com
  description: Demo / sandbox
security:
- MewsClientToken: []
  MewsAccessToken: []
tags:
- name: Languages
paths:
  /api/distributor/v1/languages/getAll:
    post:
      tags:
      - Languages
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingEngineParameters'
            examples:
              LanguagesGetAllRequestExample:
                summary: Default languages_getAll request
                x-microcks-default: true
                value:
                  Client: string
                  LanguageCode: string
                  CultureCode: string
                  FullAmounts: true
                  Session: string
                  ConfigurationId: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageResult'
              examples:
                LanguagesGetAll200Example:
                  summary: Default languages_getAll 200 response
                  x-microcks-default: true
                  value:
                    Languages:
                    - Code: string
                      Name: Example Name
                      DefaultCulture: string
      operationId: languages_getAll
      summary: Mews Get All
      description: Get All via the Mews Booking Engine (Distributor) API languages resource.
      x-microcks-operation:
        delay: 0
        dispatcher: FALLBACK
  /api/connector/v1/languages/getAll:
    post:
      tags:
      - Languages
      summary: Mews Get All Languages
      description: Returns all languages supported by the API.
      operationId: languages_getAll
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Parameters'
