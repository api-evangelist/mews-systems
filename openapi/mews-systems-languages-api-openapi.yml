components:
  schemas:
    LanguageResult:
      title: LanguageResult
      required:
      - Languages
      type: object
      properties:
        Languages:
          type: array
          items:
            $ref: '#/components/schemas/Language'
      additionalProperties: false
      x-schema-id: LanguageResult
    LanguageTextParameters:
      title: LanguageTextParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - LanguageCodes
      - Scope
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
          example: string
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
          example: string
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
          example: string
        LanguageCodes:
          type: array
          items:
            type: string
          description: Language-culture codes of the `Languages` whose texts to return.
        Scope:
          minLength: 1
          type: string
          description: Scope of texts to return.
          example: string
      additionalProperties: false
      x-schema-id: LanguageTextParameters
    LanguageTextResult:
      title: LanguageTextResult
      required:
      - LanguageTexts
      type: object
      properties:
        LanguageTexts:
          type: array
          items:
            $ref: '#/components/schemas/LanguageTexts'
          description: Texts in the specified languages.
      additionalProperties: false
      x-schema-id: LanguageTextResult
    BookingEngineParameters:
      title: BookingEngineParameters
      required:
      - Client
      - ConfigurationId
      - FullAmounts
      type: object
      properties:
        Client:
          minLength: 1
          type: string
          example: string
        LanguageCode:
          type:
          - string
          - 'null'
          example: string
        CultureCode:
          type:
          - string
          - 'null'
          example: string
        FullAmounts:
          type: boolean
          example: true
        Session:
          type:
          - string
          - 'null'
          example: string
        ConfigurationId:
          type: string
          format: uuid
          example: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
      additionalProperties: false
      x-schema-id: BookingEngineParameters
    Parameters:
      title: Parameters
      required:
      - AccessToken
      - Client
      - ClientToken
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
          example: string
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
          example: string
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
          example: string
      additionalProperties: false
      x-schema-id: Parameters
    LanguageTexts:
      title: Language texts
      required:
      - LanguageCode
      - Texts
      type: object
      properties:
        LanguageCode:
          minLength: 1
          type: string
          description: Language-culture code of the `Language`.
          example: string
        Texts:
          title: Dictionary
          type: object
          additionalProperties:
            type: string
          description: Texts in the specified language by their keys.
          x-schema-id: Dictionary
      additionalProperties: false
      x-schema-id: LanguageTexts
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
      type: object
      properties:
        Message:
          type:
          - string
          - 'null'
          example: string
        RequestId:
          type:
          - string
          - 'null'
          example: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
        Details:
          example: string
      additionalProperties: false
      x-schema-id: ConnectorApiExceptionResult
    Language:
      title: Language
      required:
      - Code
      - DefaultCulture
      - Name
      type: object
      properties:
        Code:
          minLength: 1
          type: string
          example: string
        Name:
          minLength: 1
          type: string
          example: Example Name
        DefaultCulture:
          allOf:
          - $ref: '#/components/schemas/Culture'
          example: string
      additionalProperties: false
      x-schema-id: Language
    LanguageResult_2:
      title: LanguageResult
      required:
      - Languages
      type: object
      properties:
        Languages:
          type: array
          items:
            $ref: '#/components/schemas/Language_2'
          description: The supported languages.
      additionalProperties: false
      x-schema-id: LanguageResult
    Language_2:
      title: Language
      required:
      - Code
      - EnglishName
      - LocalName
      type: object
      properties:
        Code:
          minLength: 1
          type: string
          description: Language-culture code of the language.
          example: string
        FallbackLanguageCode:
          type:
          - string
          - 'null'
          description: Language-culture code of the fallback language.
          example: string
        EnglishName:
          minLength: 1
          type: string
          description: English name of the language.
          example: Example Name
        LocalName:
          minLength: 1
          type: string
          description: Local name of the language.
          example: Example Name
      additionalProperties: false
      x-schema-id: Language
    Culture:
      title: Culture
      required:
      - CurrencyDecimalSeparator
      - CurrencyGroupSeparator
      type: object
      properties:
        CurrencyDecimalSeparator:
          minLength: 1
          type: string
          example: EUR
        CurrencyGroupSeparator:
          minLength: 1
          type: string
          example: EUR
      additionalProperties: false
      x-schema-id: Culture
  securitySchemes:
    MewsClientToken:
      type: apiKey
      in: header
      name: ClientToken
      description: Mews authentication is performed by supplying ClientToken, AccessToken and Client as fields in the JSON request body (not as HTTP headers). This securityScheme is a tooling-compatible representation of the ClientToken credential. ClientToken is unique to your application and identifies the API client.
    MewsAccessToken:
      type: apiKey
      in: header
      name: AccessToken
      description: Tooling-compatible representation of the AccessToken credential, which is supplied in the JSON request body. AccessToken is unique to the connection with a property (enterprise) and identifies the property or properties whose data and services you can access. Portfolio Access Tokens enable multi-property access with a single token.
