  /api/connector/v1/languages/getTexts:
    post:
      tags:
      - Languages
      summary: Mews Get Language Texts
      description: Returns translations of texts in the specified languages.
      operationId: languages_getTexts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LanguageTextParameters'
            example:
              ClientToken: E0D439EE522F44368DC78E1BFB03710C-D24FB11DBE31D4621C4817E028D9E1D
              AccessToken: C66EF7B239D24632943D115EDE9CB810-EA00F8FD8294692C940F6B5A8F9453D
              Client: Sample Client 1.0.0
              LanguageCodes:
              - en-US
              - cs-CZ
              Scope: ''
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LanguageTextResult'
              example:
                LanguageTexts:
                - LanguageCode: en-US
                  Texts:
                    Address: Address
                    AddressLine1: Address line 1
