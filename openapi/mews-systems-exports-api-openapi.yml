          allOf:
          - $ref: '#/components/schemas/Export'
          description: Added export.
          example: string
      additionalProperties: false
      x-schema-id: ExportAddResult
    ExportScope:
      title: Export scope
      type: object
      properties:
        EnterpriseIds:
          maxItems: 1000
          minItems: 1
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Unique identifiers of enterprises for which the data is exported.
        ChainIds:
          maxItems: 1000
          minItems: 1
          type:
          - array
          - 'null'
          items:
            type: string
            format: uuid
          description: Unique identifiers of chains for which the data is exported.
      additionalProperties: false
      x-schema-id: ExportScope
    TimeFilterInterval:
      title: Time interval
      type: object
      properties:
        StartUtc:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-06-02T14:30:00Z'
        EndUtc:
          type:
          - string
          - 'null'
          format: date-time
          example: '2026-06-02T14:30:00Z'
      additionalProperties: false
      description: "When a time interval is used for **filtering** (for example in parameters such as `CreatedUtc.StartUtc` / `CreatedUtc.EndUtc`), the following rules apply:\n\n- **Start equals End (equality mode)**  \n  If `StartUtc` and `EndUtc` are exactly the same timestamp, the filter is treated as an equality check for that precise moment in time:\n  \n  ```\n  CreatedUtc == StartUtc\n  ```\n  \n  This does not represent an interval; only records with `CreatedUtc` equal to that exact instant are returned.\n\n- **Start differs from End (interval mode)**  \n  If `StartUtc` and `EndUtc` are different, the filter is evaluated as a half-open interval:\n  \n  ```\n  StartUtc <= CreatedUtc < EndUtc\n  ```\n  \n  In other words, the start is inclusive and the end is exclusive.\n\nMake sure your integration takes inclusive Start / exclusive End behavior of time intervals into account so that no records at the boundaries are omitted."
      x-schema-id: TimeFilterInterval
    ExportAddParameters:
      title: ExportAddParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - EntityType
      type: object
      properties:
        ClientToken:
          minLength: 1
          type: string
          description: Token identifying the client application.
          example: string
        AccessToken:
          minLength: 1
          type: string
          description: Access token of the client application.
          example: string
        Client:
          minLength: 1
          type: string
          description: Name and version of the client application.
          example: string
        EntityType:
          allOf:
          - $ref: '#/components/schemas/ExportEntityTypeEnum'
          description: 'Specifies the type of entity which should be exported.


            OrderItem


            Payment


            Reservation


            Customer


            Company


            Bill


            AvailabilityAdjustment


            AvailabilityBlock


            ResourceBlock


            LedgerEntry (**Beta testing - subject to change.** See [Ledger entry type](https://docs.mews.com/connector-api/operations/_export-types#ledger-entry).)'
          example: string
        Scope:
          title: Export scope parameters
          allOf:
          - $ref: '#/components/schemas/ExportScopeParameters'
          description: Selects enterprises or chains for which the data should be exported. Which one is used depends on `EntityType`. If not specified, the export will include all enterprises or chains the client has access to.
          example: string
        Filters:
          title: Export data filters
          allOf:
          - $ref: '#/components/schemas/ExportDataFilters'
          description: Specifies filters to apply on the exported data set. If omitted, the export will include all available data.
          example: string
      additionalProperties: false
      x-schema-id: ExportAddParameters
    ConnectorApiExceptionResult:
      title: ConnectorApiExceptionResult
