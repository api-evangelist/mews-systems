              schema:
                $ref: '#/components/schemas/ExportResult'
              example:
                Exports:
                - Id: 3fa85f64-5717-4562-b3fd-2c963f66afa6
                  Status: Success
                  EntityType: OrderItem
                  Scope:
                    EnterpriseIds:
