components:
  schemas:
    ExtendedAmountParameters:
      title: Amount parameters
      required:
      - Currency
      type: object
      properties:
        Currency:
          minLength: 1
          type: string
          description: ISO-4217 code of the `Currency`.
          format: currency
          example: EUR
        TaxCodes:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The tax values applied.
        NetValue:
          type:
          - number
          - 'null'
          description: Net value in case the item is taxed.
          format: double
          example: 100.0
        GrossValue:
          type:
          - number
          - 'null'
          description: Gross value including all taxes.
          format: double
          example: 100.0
      additionalProperties: false
      description: ''
      x-schema-id: ExtendedAmountParameters
    CreditCardResult:
      title: CreditCardResult
      required:
      - CreditCards
      type: object
      properties:
        CreditCards:
          type: array
          items:
            $ref: '#/components/schemas/CreditCard'
          description: The credit cards.
        Cursor:
          type:
          - string
          - 'null'
          description: Unique identifier of the item one newer in time order than the items to be returned. If Cursor is not specified, i.e. null, then the latest or most recent items will be returned.
          format: uuid
          example: 3edd5f9e-7e64-4f2a-9a0e-b3f200e6c111
      additionalProperties: false
      x-schema-id: CreditCardResult
    TokenizedCreditCardAddParameters:
      title: TokenizedCreditCardAddParameters
      required:
      - AccessToken
      - Client
      - ClientToken
      - CreditCardData
      - CustomerId
