description: >-
  Mews is a cloud-native hospitality cloud and property management system (PMS) headquartered in Prague, Czech Republic
  that powers reservations, operations, payments, point of sale, revenue management, and distribution for more than
  15,000 hospitality properties globally. The Mews Open API surface is organised into five product APIs — the
  general-purpose Connector API for partners working with Mews Operations data, the Channel Manager API for two-way
  distribution with OTAs and channel managers, the Booking Engine API for guest-facing reservation creation, the POS API
  for point-of-sale integrations, and the Loyalty Partner reverse API for membership systems. Mews also runs a
  marketplace of more than 1,000 hospitality integrations.
created: '2026-05-25'
modified: '2026-06-02'
specificationVersion: '0.19'
apis:
- aid: mews-systems:mews-channel-manager-api
  name: Mews Channel Manager API
  tags:
  - Channel Manager
  - Distribution
  - OTA
  - Availability
  - Rates
  - Inventory
  - Reservations
  humanURL: https://docs.mews.com/channel-manager-api
  baseURL: https://api.mews.com/api/channelManager/v1
  properties:
  - url: https://docs.mews.com/channel-manager-api
    type: Documentation
  - url: https://docs.mews.com/channel-manager-api/guidelines
    type: Documentation
  - url: https://docs.mews.com/channel-manager-api/operations
    type: APIReference
  - url: https://docs.mews.com/channel-manager-api/changelog
    type: ChangeLog
  - url: https://docs.mews.com/channel-manager-api/deprecations
    type: Documentation
  description: >-
    The Mews Channel Manager API is the two-way distribution surface between Mews and channel managers,
    online travel agents (OTAs), and other bulk sales channels. Mews pushes availability, rates, and inventory
    updates outbound to the channel manager, while the channel manager pushes new and modified reservations
    back into Mews. The API defines both Mews-side endpoints (consumed by the channel manager) and Channel
    Manager-side endpoints (consumed by Mews) so that pricing, restrictions, stop-sells, and reservation
    lifecycle stay in sync across all connected demand channels.
- aid: mews-systems:mews-pos-api
  name: Mews POS API
  tags:
  - POS
  - Point of Sale
  - Orders
  - Restaurant
  - Bills
  - Hospitality
  humanURL: https://docs.mews.com/pos-api
  baseURL: https://api.mews.com/api/pos/v1
  properties:
  - url: https://docs.mews.com/pos-api
    type: Documentation
  - url: https://docs.mews.com/pos-api/guidelines
    type: Documentation
  - url: https://docs.mews.com/pos-api/operations
    type: APIReference
  - url: https://docs.mews.com/pos-api/changelog
    type: ChangeLog
  description: >-
    The Mews POS API gives partner point-of-sale systems real-time access to Mews POS data and services
    so that food and beverage, retail, and ancillary outlets can post charges to guest folios, share menus
    and product catalogues, manage table state, and reconcile orders with the property management system.
    Typical integrators include restaurant POS vendors, table-booking apps, inventory and stock-management
    systems, and F&B business-intelligence tools.
- aid: mews-systems:mews-loyalty-partner-api
  name: Mews Loyalty Partner API
  tags:
  - Loyalty
  - Membership
  - Reverse API
  - Hospitality
  humanURL: https://docs.mews.com/loyalty-partner-api
  baseURL: https://partner.example.com
  properties:
  - url: https://docs.mews.com/loyalty-partner-api
    type: Documentation
  description: >-
    The Mews Loyalty Partner API is a reverse API — Mews calls endpoints that the loyalty provider hosts
    — used to integrate third-party loyalty and membership programs with Mews Operations. Loyalty partners
    implement the contract so that member lookup, enrollment, point accrual, and point redemption can
    happen automatically in the Mews reservation, check-in, and billing flow.
